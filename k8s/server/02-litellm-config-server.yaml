# ============================================
# LiteLLM 配置 (Server) — 路由到服务器 vLLM
# ============================================
# 由 deploy-server.sh 在 base 02-configmaps.yaml 之后 apply,
# strategic-merge 覆盖 litellm-config 的 config.yaml (nginx configmap 不受影响)。
#
# 模型映射:
#   qwen2.5 (别名) / deepseek-r1-distill-qwen-32b (真实名) → 文本 vLLM (text-inference)
#   llava   (别名) / qwen3-vl-32b-instruct        (真实名) → 视觉 vLLM (vision-inference)
# 保留 qwen2.5/llava 别名, 使 proxy/stream/dashboard/server.py 零改动即可工作。
# vLLM 用 openai/<model> + api_base (OpenAI 兼容, Qwen-VL image_url 透传)。
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: openclaw
data:
  config.yaml: |
    model_list:
      # ---------- 文本模型 (替代本机 qwen2.5:3b) ----------
      - model_name: deepseek-r1-distill-qwen-32b
        litellm_params:
          model: openai/deepseek-r1-distill-qwen-32b
          api_base: http://text-inference:8000/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300
      - model_name: qwen2.5            # 兼容旧调用方 (dashboard/proxy 默认发 qwen2.5)
        litellm_params:
          model: openai/deepseek-r1-distill-qwen-32b
          api_base: http://text-inference:8000/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300

      # ---------- 视觉模型 (替代本机 llava:7b) ----------
      - model_name: qwen3-vl-32b-instruct
        litellm_params:
          model: openai/qwen3-vl-32b-instruct
          api_base: http://vision-inference:8000/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300
      - model_name: llava              # 兼容旧调用方 (proxy 含图自动切 llava)
        litellm_params:
          model: openai/qwen3-vl-32b-instruct
          api_base: http://vision-inference:8000/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300

      # ---------- FunASR 本地语音识别 (不变) ----------
      - model_name: funasr
        litellm_params:
          model: openai/whisper-1
          api_base: http://funasr:8199/v1
          timeout: 60

      # ---------- Embedding (服务器 Ollama 已下线, 暂禁用) ----------
      # 如服务器提供 embedding 端点, 在此加回 (例如 openai/bge-m3 + api_base)。
      # - model_name: bge-embedding
      #   litellm_params:
      #     model: openai/bge-m3
      #     api_base: http://embedding-inference:8000/v1
      #     api_key: os.environ/VLLM_API_KEY
      #     timeout: 30

    router_settings:
      routing_strategy: latency-based-routing
      num_retries: 2
      timeout: 300
      allowed_fails: 3
      cooldown_time: 60
      retry_after: 60
      model_group_alias:
        chat: qwen2.5
        vision: llava
        asr: funasr
        # embedding: bge-embedding   # 暂禁用

    general_settings:
      drop_params: true
      set_verbose: false
      master_key: os.environ/LITELLM_MASTER_KEY

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      callbacks: ["prometheus"]
