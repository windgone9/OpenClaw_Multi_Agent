# ============================================
# FunASR (Server) — 本地语音识别 (本机 base 09 的 IfNotPresent 版本)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funasr
  namespace: openclaw
  labels:
    app: funasr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: funasr
  template:
    metadata:
      labels:
        app: funasr
    spec:
      containers:
        - name: funasr
          image: openclaw-funasr:latest
          imagePullPolicy: IfNotPresent          # Server: 真实集群
          command: ["funasr-server", "--device", "cpu", "--model", "sensevoice", "--host", "0.0.0.0", "--port", "8199"]
          ports:
            - containerPort: 8199
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8199
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8199
            initialDelaySeconds: 60
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: funasr
  namespace: openclaw
spec:
  selector:
    app: funasr
  ports:
    - port: 8199
      targetPort: 8199
  type: ClusterIP
