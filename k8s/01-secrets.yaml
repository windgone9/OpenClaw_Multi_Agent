# ============================================
# Secrets — OpenClaw Multi-Agent
# 修改 stringData 中的值后部署
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw
type: Opaque
stringData:
  litellm-master-key: "sk-litellm-local"
  openclaw-token: ""
  deepseek-api-key: ""
  moonshot-api-key: ""
  doubao-asr-key: ""
  # vLLM 访问密钥 (服务器 vLLM 默认无需鉴权, 留 EMPTY; 若 vLLM 启动带 --api-key 则填真实 key)
  vllm-api-key: "EMPTY"
  postgres-password: "litellm_db_pass"
  minio-root-user: "minioadmin"
  minio-root-password: "minioadmin"
  database-url: "postgresql://litellm:litellm_db_pass@litellm-db:5432/litellm"
