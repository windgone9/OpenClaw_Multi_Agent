# ============================================
# LiteLLM 配置 (本地 vLLM 验证) — 路由到 GPUStack vLLM
# ============================================
# feature_localUsingvLLM 分支: 本地 Kind K8S + 远程 GPUStack vLLM (192.168.0.151)。
# 由 deploy-local-vllm.sh 在 base 02-configmaps.yaml 之后 apply,
# strategic-merge 覆盖 litellm-config 的 config.yaml (nginx configmap 不受影响)。
#
# 模型映射 (GPUStack 已部署, OpenAI 兼容 /v1):
#   qwen2.5 (别名) / deepseek-r1-distill-qwen-32b → 文本
#   llava   (别名) / qwen3-vl-32b-instruct        → 视觉
# 保留 qwen2.5/llava 别名, 使 proxy/stream/dashboard 零改动即可工作。
# api_base 直接用 GPUStack IP (Kind pod 可达, 已验证); api_key 走 VLLM_API_KEY env/secret。
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: openclaw
data:
  config.yaml: |
    model_list:
      # ---------- 文本模型 (GPUStack deepseek-r1-distill-qwen-32b) ----------
      - model_name: deepseek-r1-distill-qwen-32b
        litellm_params:
          model: openai/deepseek-r1-distill-qwen-32b
          api_base: http://192.168.0.151/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300
      - model_name: qwen2.5            # 兼容旧调用方 (dashboard/proxy 默认发 qwen2.5)
        litellm_params:
          model: openai/deepseek-r1-distill-qwen-32b
          api_base: http://192.168.0.151/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300

      # ---------- 视觉模型 (GPUStack qwen3-vl-32b-instruct) ----------
      - model_name: qwen3-vl-32b-instruct
        litellm_params:
          model: openai/qwen3-vl-32b-instruct
          api_base: http://192.168.0.151/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300
      - model_name: llava              # 兼容旧调用方 (proxy 含图自动切 llava)
        litellm_params:
          model: openai/qwen3-vl-32b-instruct
          api_base: http://192.168.0.151/v1
          api_key: os.environ/VLLM_API_KEY
          timeout: 300

      # ---------- FunASR 本地语音识别 (不变) ----------
      - model_name: funasr
        litellm_params:
          model: openai/whisper-1
          api_base: http://funasr:8199/v1
          timeout: 60

      # ---------- Embedding (本地 ollama, 保留) ----------
      - model_name: bge-embedding
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama:11434
          timeout: 30

    router_settings:
      routing_strategy: latency-based-routing
      num_retries: 2
      timeout: 300
      allowed_fails: 3
      cooldown_time: 60
      retry_after: 60
      model_group_alias:
        chat: qwen2.5
        vision: llava
        asr: funasr
        embedding: bge-embedding

    general_settings:
      drop_params: true
      set_verbose: false
      master_key: os.environ/LITELLM_MASTER_KEY

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      callbacks: ["prometheus"]
