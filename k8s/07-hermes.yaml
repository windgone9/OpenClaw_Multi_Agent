# ============================================
# Hermes Agent — K8S 智能路由 + 自学习
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: openclaw
  labels:
    app: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      containers:
        - name: hermes
          image: openclaw-hermes:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: HERMES_PORT
              value: "8082"
            - name: QUEUE_BACKEND
              value: "inprocess"
            - name: LITELLM_INTERNAL_URL
              value: "http://litellm:4000"
            - name: STREAM_INTERNAL_URL
              value: "http://stream-service:8084"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: litellm-master-key
            - name: FUNASR_URL
              value: "http://funasr:8199"
            - name: OPENCLAW_OFFICIAL_GATEWAY_URL
              value: "http://openclaw-gw:3005"
            - name: OPENCLAW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: openclaw-token
                  optional: true
            - name: WATCHDOG_ENABLED
              value: "false"
            - name: DEFAULT_CHAT_MODEL
              value: "qwen2.5:3b"
            - name: OLLAMA_MODEL
              value: "qwen2.5:3b"
            - name: LOCAL_MODEL
              value: "qwen2.5:3b"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: openclaw
spec:
  selector:
    app: hermes
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hermes-hpa
  namespace: openclaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
