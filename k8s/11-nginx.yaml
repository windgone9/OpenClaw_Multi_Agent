# ============================================
# Nginx — 反向代理 + 负载均衡
# 使用 NodePort 暴露，Kind 通过 extraPortMappings 映射到宿主机
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: openclaw
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        - name: nginx-envsubst
          image: nginx:1.25-alpine
          command: ['sh', '-c', 'envsubst "${LITELLM_MASTER_KEY}" < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf']
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: litellm-master-key
          volumeMounts:
            - name: nginx-config-template
              mountPath: /etc/nginx/templates/
            - name: nginx-output
              mountPath: /etc/nginx/conf.d/
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-output
              mountPath: /etc/nginx/conf.d/
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: nginx-config-template
          configMap:
            name: nginx-config-template
        - name: nginx-output
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: openclaw
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
