<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<defs>
  <style>
    .title { font: bold 22px 'Segoe UI', sans-serif; fill: #1a1a2e; }
    .box-label { font: bold 13px 'Segoe UI', sans-serif; fill: #fff; }
    .sub-label { font: bold 14px 'Segoe UI', sans-serif; }
    .node-label { font: 12px 'Segoe UI', sans-serif; fill: #333; }
    .decision-label { font: bold 12px 'Segoe UI', sans-serif; fill: #fff; }
    .arrow { stroke: #78909C; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#78909C"/></marker>
</defs>
<rect width="1200" height="900" fill="#f8f9fa" rx="10"/>
<text x="600" y="35" text-anchor="middle" class="title">端到端请求时序图</text>
<rect x="45" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="85" y="80" text-anchor="middle" class="box-label" font-size="11">客户端</text>
<line x1="85" y1="90" x2="85" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="200" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="240" y="80" text-anchor="middle" class="box-label" font-size="11">调度器</text>
<line x1="240" y1="90" x2="240" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="355" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="395" y="80" text-anchor="middle" class="box-label" font-size="11">Bridge</text>
<line x1="395" y1="90" x2="395" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="510" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="550" y="80" text-anchor="middle" class="box-label" font-size="11">SmartRouter</text>
<line x1="550" y1="90" x2="550" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="665" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="705" y="80" text-anchor="middle" class="box-label" font-size="11">Gateway</text>
<line x1="705" y1="90" x2="705" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="820" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="860" y="80" text-anchor="middle" class="box-label" font-size="11">OC GW</text>
<line x1="860" y1="90" x2="860" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="975" y="60" width="80" height="30" rx="5" fill="#5C6BC0"/>
<text x="1015" y="80" text-anchor="middle" class="box-label" font-size="11">模型</text>
<line x1="1015" y1="90" x2="1015" y2="700" stroke="#5C6BC0" stroke-width="1" stroke-dasharray="5,3"/>
<line x1="85" y1="120" x2="240" y2="120" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="162.5" y="115" text-anchor="middle" class="node-label" font-size="10">POST /dispatch</text>
<line x1="240" y1="150" x2="240" y2="150" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="240" y="145" text-anchor="middle" class="node-label" font-size="10">Pre Hooks</text>
<line x1="240" y1="180" x2="395" y2="180" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="317.5" y="175" text-anchor="middle" class="node-label" font-size="10">POST /dispatch (smart)</text>
<line x1="395" y1="210" x2="550" y2="210" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="472.5" y="205" text-anchor="middle" class="node-label" font-size="10">smartRouteDecision</text>
<line x1="550" y1="240" x2="395" y2="240" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="472.5" y="235" text-anchor="middle" class="node-label" font-size="10">decision=gateway/agent</text>
<line x1="395" y1="280" x2="705" y2="280" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="550" y="275" text-anchor="middle" class="node-label" font-size="10">Gateway路径: /v1/chat/completions</text>
<line x1="395" y1="320" x2="860" y2="320" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="627.5" y="315" text-anchor="middle" class="node-label" font-size="10">Agent路径: /v1/chat/completions</text>
<line x1="705" y1="360" x2="1015" y2="360" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="860" y="355" text-anchor="middle" class="node-label" font-size="10">转发到模型API</text>
<line x1="860" y1="400" x2="1015" y2="400" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="937.5" y="395" text-anchor="middle" class="node-label" font-size="10">Agent调度推理</text>
<line x1="1015" y1="440" x2="705" y2="440" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="860" y="435" text-anchor="middle" class="node-label" font-size="10">模型响应</text>
<line x1="1015" y1="470" x2="860" y2="470" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="937.5" y="465" text-anchor="middle" class="node-label" font-size="10">模型响应</text>
<line x1="705" y1="510" x2="395" y2="510" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="550" y="505" text-anchor="middle" class="node-label" font-size="10">结果</text>
<line x1="860" y1="540" x2="395" y2="540" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="627.5" y="535" text-anchor="middle" class="node-label" font-size="10">结果</text>
<line x1="395" y1="580" x2="240" y2="580" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="317.5" y="575" text-anchor="middle" class="node-label" font-size="10">结果+smart_routing+trace</text>
<line x1="240" y1="610" x2="240" y2="610" stroke="#5C6BC0" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="240" y="605" text-anchor="middle" class="node-label" font-size="10">Post Hooks</text>
<line x1="240" y1="650" x2="85" y2="650" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah)"/>
<text x="162.5" y="645" text-anchor="middle" class="node-label" font-size="10">DispatchResponse</text>
<rect x="100" y="260" width="880" height="50" rx="4" fill="#2196F320" stroke="#2196F3" stroke-width="1"/>
<text x="540" y="280" text-anchor="middle" class="node-label" fill="#2196F3" font-size="10">alt: score &lt; 40 → Gateway路径</text>
<rect x="100" y="310" width="880" height="50" rx="4" fill="#E91E6320" stroke="#E91E63" stroke-width="1"/>
<text x="540" y="330" text-anchor="middle" class="node-label" fill="#E91E63" font-size="10">alt: score &gt;= 40 → Agent路径</text>
</svg>