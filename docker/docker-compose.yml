# ============================================
# OpenClaw Multi-Agent — Docker Compose 部署配置
# 基于 LiteLLM Proxy + Hermes Agent 混合架构
#
# 使用方式:
#   docker compose up -d
#   docker compose up -d --scale litellm=3    # 扩展 LiteLLM 实例
#   docker compose up -d --scale stream=2     # 扩展 Stream 实例
# ============================================

services:
  # ==================== Ollama 本地模型服务 ====================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==================== LiteLLM Proxy (可水平扩展) ====================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - DOUBAO_ASR_KEY=${DOUBAO_ASR_KEY:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    expose:
      - "4000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==================== Nginx 负载均衡 ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - litellm
      - hermes
      - stream-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Hermes Agent (K8S + 自学习路由) ====================
  hermes:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hermes
    container_name: hermes
    environment:
      - OPENCLAW_OFFICIAL_GATEWAY_URL=http://openclaw-gw:3005
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
      - OLLAMA_URL=http://ollama:11434
      - HERMES_PORT=8082
      - QUEUE_BACKEND=inprocess
    ports:
      - "8082:8082"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==================== OpenClaw Gateway ====================
  openclaw-gw:
    image: node:20-alpine
    container_name: openclaw-gw
    working_dir: /app
    environment:
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
    ports:
      - "3005:3005"
    volumes:
      - ${OPENCLAW_PATH:-../openclaw}:/app:ro
    command: ["node", "openclaw.mjs", "gateway", "--port", "3005", "--force", "--allow-unconfigured"]
    restart: unless-stopped

  # ==================== Stream Service (实时推流) ====================
  stream-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.stream
    environment:
      - OLLAMA_URL=http://ollama:11434
      - DOUBAO_ASR_KEY=${DOUBAO_ASR_KEY:-}
      - STREAM_PORT=8084
    expose:
      - "8084"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  ollama_data:
