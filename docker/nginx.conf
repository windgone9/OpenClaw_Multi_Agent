upstream litellm_backend {
    least_conn;
    server litellm:4000;
    keepalive 32;
}

upstream hermes_backend {
    least_conn;
    server hermes:8082;
    keepalive 16;
}

upstream stream_backend {
    ip_hash;
    server stream-service:8084;
}

upstream stream_ws_backend {
    server stream-service:8084;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    client_body_timeout 300s;

    # ---------- 健康检查 ----------
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ---------- LiteLLM OpenAI 兼容接口 ----------
    # 对话 / 补全 / 流式
    location /v1/chat/completions {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /v1/completions {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Embedding
    location /v1/embeddings {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ASR 语音识别
    location /v1/audio/ {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    # 模型列表
    location /v1/models {
        proxy_pass http://litellm_backend;
        proxy_set_header Host $host;
    }

    # LiteLLM 管理接口
    location /litellm/ {
        proxy_pass http://litellm_backend/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_redirect http://localhost:80/ http://$http_host/litellm/;
        proxy_redirect http://localhost/ http://$http_host/litellm/;
        proxy_redirect / /litellm/;
    }

    # LiteLLM UI 及其 API（LiteLLM 重定向到 /ui/，UI 内部请求 /ui/api/ 等）
    location /ui/ {
        proxy_pass http://litellm_backend/ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }

    # LiteLLM UI 静态资源
    location /litellm-asset-prefix/ {
        proxy_pass http://litellm_backend/litellm-asset-prefix/;
        proxy_set_header Host $http_host;
    }

    # LiteLLM UI 内部 API（如 /get_favicon 等）
    location /get_favicon {
        proxy_pass http://litellm_backend;
        proxy_set_header Host $http_host;
    }

    # ---------- Hermes Agent K8S 接口 ----------
    location /k8s/ {
        proxy_pass http://hermes_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Hermes 健康检查 & 统计
    location /hermes/health {
        proxy_pass http://hermes_backend/health;
        proxy_set_header Host $host;
    }

    location /hermes/stats {
        proxy_pass http://hermes_backend/stats;
        proxy_set_header Host $host;
    }

    # ---------- Stream Service WebSocket ----------
    location /v1/stream/ws {
        proxy_pass http://stream_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Stream SSE
    location /v1/stream/sse {
        proxy_pass http://stream_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # FunASR 流式 ASR WebSocket
    location /v1/stream/asr {
        proxy_pass http://stream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Stream ASR 文件上传 (HTTP POST)
    location /v1/stream/asr/file {
        proxy_pass http://stream_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    # ---------- 统一入口 (根据 type 字段路由) ----------
    location = /v1/chat {
        proxy_pass http://hermes_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        client_max_body_size 50m;
    }

    # 系统指标
    location = /v1/system/metrics {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
    }

    # 多模态对话接口
    location /v1/multimodal/ {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # MinIO 预签名
    # MinIO 对象存储代理 (兼容 S3 API)
    location /v1/minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    # Stream Service 健康检查
    location /v1/stream/health {
        proxy_pass http://stream_backend;
        proxy_set_header Host $host;
    }

    # ---------- Dashboard ----------
    location /dashboard.html {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
    }

    location /new_dashboard.html {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /static/ {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
    }

    # ---------- 服务健康检查代理 (供 Dashboard 使用) ----------
    location /svc/litellm/ {
        proxy_pass http://litellm_backend/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location /svc/stream/ {
        proxy_pass http://stream_backend/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location /svc/funasr/ {
        proxy_pass http://funasr:8199/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_http_version 1.1;
    }

    location /svc/ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
