upstream litellm_backend {
    least_conn;
    server litellm-1:4000;
    server litellm-2:4000;
    server litellm-3:4000;
    keepalive 32;
}

upstream hermes_backend {
    least_conn;
    server hermes:8082;
    keepalive 16;
}

upstream stream_backend {
    ip_hash;
    server stream-service:8084;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    client_body_timeout 300s;

    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://litellm_backend/health;
        proxy_set_header Host $host;
    }

    # ---------- LiteLLM OpenAI 兼容接口 ----------
    # 对话 / 补全 / 流式
    location /v1/chat/completions {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /v1/completions {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Embedding
    location /v1/embeddings {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ASR 语音识别
    location /v1/audio/ {
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    # 模型列表
    location /v1/models {
        proxy_pass http://litellm_backend;
        proxy_set_header Host $host;
    }

    # LiteLLM 管理接口
    location /litellm/ {
        proxy_pass http://litellm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- Hermes Agent K8S 接口 ----------
    location /k8s/ {
        proxy_pass http://hermes_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Hermes 健康检查 & 统计
    location /hermes/health {
        proxy_pass http://hermes_backend/health;
        proxy_set_header Host $host;
    }

    location /hermes/stats {
        proxy_pass http://hermes_backend/stats;
        proxy_set_header Host $host;
    }

    # ---------- Stream Service WebSocket ----------
    location /v1/stream/ws {
        proxy_pass http://stream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Stream SSE
    location /v1/stream/sse {
        proxy_pass http://stream_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---------- Dashboard ----------
    location /dashboard.html {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
    }
}
